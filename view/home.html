<!DOCTYPE html>
<html>

<head>
  <title>Home</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f6fb;
      text-align: center;
    }

    .box {
      background: white;
      width: 320px;
      margin: 150px auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    a button {
      padding: 10px 25px;
      background: #0081ec;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    a button:hover {
      background: #006fd1;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Welcome 👋</h1>
    <p>Click below to login</p>
    <a href="/login"><button>Go to Login</button></a>
  </div>

</body>

</html>
