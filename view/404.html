<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>404 - Page Not Found</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      text-align: center;
    }

    .box {
      background: white;
      width: 360px;
      margin: 150px auto;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 60px;
      color: #5f3dc4;
      margin: 0;
    }

    p {
      color: #555;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 25px;
      background: #0081ec;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    a:hover {
      background: #006fd1;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Oops! The page you are looking for doesn’t exist.</p>
    <a href="/">Go to Home</a>
  </div>

</body>

</html>
